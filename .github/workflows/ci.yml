name: ci

on:
  push:
    branches: [main]
  pull_request:

# The application is built for Windows and macOS, so a pull request is built and tested on both,
# and on Linux because it is the cheapest host for the checks that read only the source.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format --verify-no-changes
