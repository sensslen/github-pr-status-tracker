name: ci

on:
  push:
    branches: [main]
  pull_request:

# The application ships for Windows and macOS, so a pull request is built and tested on both.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      # Windows only: .editorconfig asks for CRLF, and that is the only checkout that has it.
      - name: Format
        if: matrix.os == 'windows-latest'
        run: dotnet format --verify-no-changes
